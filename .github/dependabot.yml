version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary

  - package-ecosystem: gomod
    directory: /services/forge-relay
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/forge-relay
    schedule:
      interval: weekly
