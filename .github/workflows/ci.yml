name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

  platform:
    # Keep check names stable for branch protection (windows-latest label),
    # but pin the runner to windows-2022: windows-latest/2025 ships VS 18,
    # which node-gyp cannot resolve for better-sqlite3 native builds.
    name: Platform tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-latest
          - os: windows-2022
            label: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build platform packages
        run: |
          pnpm --filter @forge/platform run build
          pnpm --filter "@forge/config..." run build
          pnpm --filter "@forge/bus..." run build
          pnpm --filter "@forge/extension-hub..." run build
          pnpm --filter "@forge/tool-software..." run build

      - name: Run platform tests
        run: pnpm --filter @forge/platform --filter @forge/config --filter @forge/extension-hub --filter @forge/tool-software run test

  smoke:
    name: Smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-latest
          - os: windows-2022
            label: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/smoke-test.sh

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test.ps1

  desktop-pack:
    name: Desktop pack (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-latest
            pack: pack:mac
          - os: windows-2022
            label: windows-latest
            pack: pack:win
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack desktop installer
        run: pnpm --filter @forge/desktop run ${{ matrix.pack }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-desktop-${{ matrix.label }}
          path: |
            release/Forge-*-mac-*.dmg
            release/Forge-*-win-*.exe
          if-no-files-found: error

  mobile-pack:
    name: Mobile pack (android)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack Android APK
        run: pnpm pack:mobile:android

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-mobile-android
          path: release/Forge-*-android.apk
          if-no-files-found: error
